# zed-a: a ZedBoard running the example firmware as CSP node 1. It carries the
# host computer's KISS link on UART0 and forwards packets between that link
# and the CAN bus.
schema: 2
name: zed-a
description: ZedBoard running the example firmware as CSP node 1, gateway to the host computer
root: ../..                 # examples/zedboard: firmware paths start here
soc: zynq7000
soc_platform: xilinx/zynq7000
platform: ../../zedboard.repl
plugin: ../zedboard.py
zynq7000:
  straps: jtag              # no xsa: the firmware sets the clocks it uses
firmware:
  app: firmware/build/zed-node-1.elf
boot:
  default: jtag
interfaces:
  console: {kind: uart, peripheral: uart1, baud: 115200, eol: cr}
  kiss: {kind: uart, peripheral: uart0, baud: 115200}
  can: {kind: can, peripheral: can0, bitrate: 1000000}
csp:
  address: 1
  housekeeping: {port: 10, request: "01", codec: zed-status}
