# zed-b: a ZedBoard running the example firmware as CSP node 2. Its only link is
# the CAN bus; the ground station reaches it through zed-a.
schema: 2
name: zed-b
description: ZedBoard running the example firmware as CSP node 2, on the CAN bus only
root: ../..                 # examples/zedboard: firmware paths start here
soc: zynq7000
soc_platform: xilinx/zynq7000
platform: ../../zedboard.repl
plugin: ../zedboard.py
zynq7000:
  straps: jtag              # no xsa: the firmware sets the clocks it uses
firmware:
  app: firmware/build/zed-node-2.elf
boot:
  default: jtag
interfaces:
  console: {kind: uart, peripheral: uart1, baud: 115200, eol: cr}
  can: {kind: can, peripheral: can0, bitrate: 1000000}
csp:
  address: 2
  housekeeping: {port: 10, request: "01", codec: zed-status}
