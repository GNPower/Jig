# A Zynq-7000 board for Jig's own tests. Repository paths are relative to the
# board's root, tests/fixtures (the nearest .git is the Jig checkout's). The
# XSA is written by the tests that need one.
schema: 2
name: example-zynq
root: ../..
description: Zynq-7000 test fixture with one PL register block
soc: zynq7000
platform: example-zynq.repl
performance_mips: 120

zynq7000:
  xsa: build/example.xsa
  ps_version: 3
  ps_clk_hz: 50000000
  straps: jtag

options:
  pl:
    default: model
    model:
      description: the register block as a C# model
      register_maps:
        block.registerMap:
          package: hdl/example_regs_pkg.sv
          module: hdl/example_regs.sv
    rtl:
      description: the register block as Verilated RTL
      platform: rtl.repl
      commands:
        - "block Trace @{workdir}/block.vcd"
      cosim:
        peripheral: block
        build: cosim/build.sh
        sources: cosim/sources.f
        inputs: [hdl]
        library: libexample_block.so
        context: "trace={workdir}/block.vcd"

firmware:
  app: build/app.elf

boot:
  default: jtag

storage:
  flash0: {peripheral: flash0, size: 0x1000000}

interfaces:
  console: {kind: uart, peripheral: uart1, baud: 115200}
  kiss: {kind: uart, peripheral: uart0}
  can: {kind: can, peripheral: can0, bitrate: 1000000}

csp:
  address: 5

sensors:
  supply: {adc: adc0, channel: 2}

rtc: rtc0

power:
  restart: [flash0, adc0]

clocks:
  uart1.clockFrequency: uart_ref
  can0.referenceClockFrequency: can_ref
  globalTimer.frequency: cpu_3x2x
  qspi.referenceClockFrequency: lqspi_ref
