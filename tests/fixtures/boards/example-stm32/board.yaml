# An STM32 board for Jig's own tests: firmware built from source by
# firmware/build.py, booted from flash.
schema: 2
name: example-stm32
root: ../..
description: STM32F4 test fixture
soc: stm32
platform: example-stm32.repl
performance_mips: 168

stm32:
  firmware:
    build: firmware/build.py
    sources: firmware
    output: firmware.elf
  vector_table: 0x08000000

boot:
  default: flash

interfaces:
  console: {kind: uart, peripheral: usart2, baud: 115200}
  can: {kind: can, peripheral: can1, bitrate: 1000000}

csp:
  address: 1
