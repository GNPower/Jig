# A public smoke test of Jig's stm32 SoC driver: Renode's stock STM32F4
# platform runs firmware/hello.c (built from source by firmware/build.py),
# which greets on USART2 and sends one frame on CAN1.
schema: 2
root: .
name: stm32f4-hello
description: STM32F4 smoke test (USART2 greeting, one bxCAN frame)
soc: stm32
platform: stm32f4-hello.repl
performance_mips: 16

stm32:
  firmware:
    build: firmware/build.py
    sources: firmware
    output: firmware.elf
  vector_table: 0x08000000

boot:
  default: flash

interfaces:
  console: {kind: uart, peripheral: usart2, baud: 115200}
  can: {kind: can, peripheral: can1, bitrate: 1000000}
