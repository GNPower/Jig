# Weekly update pull requests for the actions the workflows pin by commit
# SHA, the Python dependencies and tool pins in pyproject.toml, and nox.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
